<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="titulo-novo-cliente">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[95vh] overflow-y-auto">
    <div class="flex items-center justify-between p-5 border-b border-gray-200">
      <h3 id="titulo-novo-cliente" class="text-lg text-gray-900">Cadastrar Cliente</h3>
      <button
        type="button"
        (click)="fechar.emit()"
        class="p-1.5 hover:bg-gray-100 rounded-lg transition-colors"
        aria-label="Fechar"
      >
        <lucide-icon [img]="XIcon" [size]="20" class="text-gray-500" />
      </button>
    </div>

    <form (submit)="handleSubmit($event)" class="p-5 space-y-4" novalidate>
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="novo-cliente-documento" class="block text-xs text-gray-600">CPF / CNPJ *</label>
          @if (tipo(); as t) {
            <span
              class="px-2 py-0.5 rounded text-xs"
              [class]="t === 'PF' ? 'bg-green-100 text-green-700' : 'bg-purple-100 text-purple-700'"
            >
              {{ t === 'PF' ? 'Pessoa Física' : 'Pessoa Jurídica' }}
            </span>
          }
        </div>
        <input
          id="novo-cliente-documento"
          type="text"
          inputmode="numeric"
          [value]="documento()"
          (input)="aoDigitarDocumento($event)"
          placeholder="000.000.000-00 ou 00.000.000/0000-00"
          [attr.aria-invalid]="tentouSalvar() && erros().documento ? 'true' : null"
          class="w-full px-3 py-2 text-sm border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          [class]="tentouSalvar() && erros().documento ? 'border-red-400' : 'border-gray-300'"
        />
        @if (tentouSalvar() && erros().documento) {
          <p class="mt-1 text-xs text-red-600">{{ erros().documento }}</p>
        }
      </div>

      <div>
        <label for="novo-cliente-nome" class="block text-xs text-gray-600 mb-1.5">Nome / Razão Social *</label>
        <input
          id="novo-cliente-nome"
          type="text"
          [value]="nome()"
          (input)="nome.set(texto($event))"
          [attr.aria-invalid]="tentouSalvar() && erros().nome ? 'true' : null"
          class="w-full px-3 py-2 text-sm border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          [class]="tentouSalvar() && erros().nome ? 'border-red-400' : 'border-gray-300'"
        />
        @if (tentouSalvar() && erros().nome) {
          <p class="mt-1 text-xs text-red-600">{{ erros().nome }}</p>
        }
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="novo-cliente-email" class="block text-xs text-gray-600 mb-1.5">E-mail</label>
          <input
            id="novo-cliente-email"
            type="email"
            [value]="email()"
            (input)="email.set(texto($event))"
            [attr.aria-invalid]="tentouSalvar() && erros().email ? 'true' : null"
            class="w-full px-3 py-2 text-sm border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
            [class]="tentouSalvar() && erros().email ? 'border-red-400' : 'border-gray-300'"
          />
          @if (tentouSalvar() && erros().email) {
            <p class="mt-1 text-xs text-red-600">{{ erros().email }}</p>
          }
        </div>
        <div>
          <label for="novo-cliente-telefone" class="block text-xs text-gray-600 mb-1.5">Telefone</label>
          <input
            id="novo-cliente-telefone"
            type="tel"
            inputmode="numeric"
            [value]="telefone()"
            (input)="aoDigitarTelefone($event)"
            placeholder="(11) 90000-0000"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <div class="col-span-2">
          <label for="novo-cliente-cidade" class="block text-xs text-gray-600 mb-1.5">Cidade</label>
          <input
            id="novo-cliente-cidade"
            type="text"
            [value]="cidade()"
            (input)="cidade.set(texto($event))"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label for="novo-cliente-uf" class="block text-xs text-gray-600 mb-1.5">UF</label>
          <select
            id="novo-cliente-uf"
            (change)="uf.set(texto($event))"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          >
            @for (u of UFS; track u) {
              <option [value]="u" [selected]="u === uf()">{{ u }}</option>
            }
          </select>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="fechar.emit()"
          class="flex-1 px-4 py-2.5 text-sm text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 text-sm text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors"
        >
          <lucide-icon [img]="SaveIcon" [size]="15" />
          Cadastrar
        </button>
      </div>
    </form>
  </div>
</div>
