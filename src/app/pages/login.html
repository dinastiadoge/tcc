<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-[#1a1d29] rounded-2xl mb-4 shadow-lg">
        <span class="text-white text-xl font-bold">WC</span>
      </div>
      <h1 class="text-2xl text-gray-900 mb-1">WC Autopeças</h1>
      <p class="text-sm text-gray-500">Sistema de Gestão</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
      <h2 class="text-lg text-gray-900 mb-5">Entrar no sistema</h2>

      @if (erro()) {
        <div class="flex items-center gap-2 p-3 mb-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
          <lucide-icon [img]="AlertCircleIcon" [size]="16" class="flex-shrink-0" />
          {{ erro() }}
        </div>
      }

      <form (ngSubmit)="handleSubmit()" ngNativeValidate class="space-y-4">
        <div>
          <label class="block text-xs text-gray-600 mb-1.5">E-mail</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="seu@email.com"
            required
            class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />
        </div>

        <div>
          <label class="block text-xs text-gray-600 mb-1.5">Senha</label>
          <div class="relative">
            <input
              [type]="mostrarSenha() ? 'text' : 'password'"
              name="senha"
              [(ngModel)]="senha"
              placeholder="••••••••"
              required
              class="w-full px-3 py-2.5 pr-10 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            />
            <button
              type="button"
              (click)="mostrarSenha.set(!mostrarSenha())"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
            >
              @if (mostrarSenha()) {
                <lucide-icon [img]="EyeOffIcon" [size]="16" />
              } @else {
                <lucide-icon [img]="EyeIcon" [size]="16" />
              }
            </button>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="carregando()"
          class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white py-2.5 px-4 rounded-lg transition-colors text-sm font-medium"
        >
          @if (carregando()) {
            <span class="flex items-center gap-2">
              <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
              </svg>
              Entrando...
            </span>
          } @else {
            <lucide-icon [img]="LogInIcon" [size]="16" />
            Entrar
          }
        </button>
      </form>
    </div>
  </div>
</div>
