<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg">
    <div class="flex items-center justify-between p-5 border-b border-gray-200">
      <h3 class="text-lg text-gray-900">Editar Produto</h3>
      <button
        (click)="fechar.emit()"
        class="p-1.5 hover:bg-gray-100 rounded-lg transition-colors"
      >
        <lucide-icon [img]="XIcon" [size]="20" class="text-gray-500" />
      </button>
    </div>

    <form (submit)="handleSubmit($event)" class="p-5 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-600 mb-1.5">Código</label>
          <input
            type="text"
            [value]="form().codigo"
            (input)="set('codigo', texto($event))"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1.5">NCM</label>
          <input
            type="text"
            [value]="form().ncm"
            (input)="set('ncm', texto($event))"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs text-gray-600 mb-1.5">Nome do Produto</label>
        <input
          type="text"
          [value]="form().nome"
          (input)="set('nome', texto($event))"
          class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-600 mb-1.5">Estoque Atual</label>
          <input
            type="number"
            [value]="form().estoque"
            (input)="set('estoque', inteiro($event))"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
            min="0"
          />
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1.5">Estoque Mínimo</label>
          <input
            type="number"
            [value]="form().minimo"
            (input)="set('minimo', inteiro($event))"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
            min="0"
          />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-600 mb-1.5">Preço de Custo (R$)</label>
          <input
            type="number"
            step="0.01"
            [value]="form().custo"
            (input)="set('custo', decimal($event))"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
            min="0"
          />
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1.5">Preço de Venda (R$)</label>
          <input
            type="number"
            step="0.01"
            [value]="form().venda"
            (input)="set('venda', decimal($event))"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
            min="0"
          />
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="fechar.emit()"
          class="flex-1 px-4 py-2.5 text-sm text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 text-sm text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors"
        >
          <lucide-icon [img]="SaveIcon" [size]="15" />
          Salvar Alterações
        </button>
      </div>
    </form>
  </div>
</div>
